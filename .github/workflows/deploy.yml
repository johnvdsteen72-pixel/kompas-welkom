name: Inspreken, filmen en publiceren

# Per pagina in paginas.json: alleen als de tekst veranderde (of bij 'forceer') maakt de
# workflow nieuwe audio (ElevenLabs) en video (HeyGen, ~$2 per minuut). De media gaan terug
# in de repo (media/), zodat een volgende run ze hergebruikt. Daarna: Cloudflare Pages.
on:
  push:
    branches: [main]
    paths: ["*.md", paginas.json, template.html, build.mjs, scripts/**]
  workflow_dispatch:
    inputs:
      forceer:
        description: "Pagina('s) opnieuw maken, ook als de tekst niet veranderde (bijv. welkomst of 'welkomst handleiding')"
        required: false
        default: ""
      video_id:
        description: "Bij één geforceerde pagina: bestaande HeyGen-video hergebruiken (video-ID)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publiceer
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Welke pagina's hebben nieuwe media nodig?
        id: nodig
        run: |
          lijst="$(node build.mjs --nodig | tr '\n' ' ') ${{ inputs.forceer }}"
          lijst="$(echo $lijst | tr ' ' '\n' | sort -u | tr '\n' ' ')"
          echo "Nieuw te maken: ${lijst:-niets}"
          echo "lijst=$lijst" >> "$GITHUB_OUTPUT"

      - name: Inspreken en filmen
        if: steps.nodig.outputs.lijst != ' ' && steps.nodig.outputs.lijst != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
        run: |
          for naam in ${{ steps.nodig.outputs.lijst }}; do
            echo "::group::$naam"
            bash scripts/maak-media.sh "$naam" "${{ inputs.video_id }}"
            echo "::endgroup::"
          done

      - name: Media terugzetten in de repo
        run: |
          git add media
          if git diff --cached --quiet; then echo "Geen nieuwe media."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Media bijgewerkt: ${{ steps.nodig.outputs.lijst }}"
          git push

      - name: Site bouwen
        run: node build.mjs

      - name: Publiceren op Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=kompas-welkom --branch=main --commit-dirty=true
