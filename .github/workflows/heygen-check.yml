name: HeyGen-koppeling controleren

# Handmatig starten: toetst HEYGEN_API_KEY (v3), toont het betaalmodel en tegoed,
# en controleert of HEYGEN_AVATAR_ID een bruikbare look is.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controleer:
    runs-on: ubuntu-latest
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
    steps:
      - name: Account, betaalmodel en tegoed
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then echo "::error::Secret HEYGEN_API_KEY ontbreekt"; exit 1; fi
          curl -sS https://api.heygen.com/v3/users/me -H "x-api-key: $HEYGEN_API_KEY" \
            | jq '.data | {billing_type, wallet, subscription, usage_based}'

      - name: Look controleren
        run: |
          echo "== Direct opvragen"
          curl -sS "https://api.heygen.com/v3/avatars/looks/$HEYGEN_AVATAR_ID" -H "x-api-key: $HEYGEN_API_KEY" \
            | jq -c '.data // .error // .' | cut -c1-600
          echo "== In de lijst met eigen looks"
          curl -sS "https://api.heygen.com/v3/avatars/looks?ownership=private&limit=50" -H "x-api-key: $HEYGEN_API_KEY" \
            | jq -r '(.data // [])[]? | "\(.name)\t\(.id)\t\(.avatar_type // .type // "")\t\(.supported_api_engines // [] | join(","))"' || true
