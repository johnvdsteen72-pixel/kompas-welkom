name: HeyGen-koppeling controleren

# Handmatig starten: toetst of HEYGEN_API_KEY werkt en toont je eigen avatars (naam + ID).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controleer:
    runs-on: ubuntu-latest
    steps:
      - name: Key en tegoed
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then echo "::error::Secret HEYGEN_API_KEY ontbreekt"; exit 1; fi
          curl --fail-with-body -sS https://api.heygen.com/v2/user/remaining_quota \
            -H "X-Api-Key: $HEYGEN_API_KEY" | jq '.data // .'

      - name: Eigen avatars
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          echo "== Avatargroepen (alleen eigen) =="
          curl -sS "https://api.heygen.com/v2/avatar_group.list?include_public=false" \
            -H "X-Api-Key: $HEYGEN_API_KEY" \
            | jq -r '(.data.avatar_group_list // [])[] | "\(.name)\t\(.id)\t\(.num_looks // "") looks"' || true
          echo "== Talking photos en de eerste 15 avatars (ook publieke) =="
          curl -sS https://api.heygen.com/v2/avatars \
            -H "X-Api-Key: $HEYGEN_API_KEY" \
            | jq -r '((.data.talking_photos // [])[] | "photo\t\(.talking_photo_name)\t\(.talking_photo_id)"), ((.data.avatars // [])[:15][] | "avatar\t\(.avatar_name)\t\(.avatar_id)")' || true
